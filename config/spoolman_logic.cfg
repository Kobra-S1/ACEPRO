#####################################################################
#   Spoolman & ACE Integration for Anycubic Kobra 3 / S1
#####################################################################
#
#   HOW TO USE (Quick Start Guide):
#
#   1. Automatic RFID Mapping (For Custom/3rd Party Tags)
#      Link an unrecognized RFID SKU to a specific Spoolman ID.
#      - UI / Macro: Click the 'MAP_SKU' macro in Mainsail/Fluidd.
#      - Parameters: Enter the SKU (e.g., "HPL17-103") and your Spoolman ID (e.g., 15).
#      - To remove a link: Use the 'UNMAP_SKU' macro and provide the SKU.
#
#   2. Manual Slot Assignment (For Spools without RFID)
#      Manually assign a Spoolman ID to a specific ACE slot (0 to 7).
#      This overrides the RFID reader for that specific slot.
#      - UI / Macro: Click the 'SPOOLMAN_MANUAL_SLOT' macro.
#      - Parameters: Enter the SLOT (0-7) and your Spoolman ID (e.g., 42).
#
#   Note: Toolchange macros (T0-T7) will automatically sync the 
#   correct spool with your Spoolman instance during color changes.
#
#####################################################################

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID and params.ID|int > 0 %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=params.ID|int)}
  {% else %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}

[gcode_macro _SET_SPOOL_BY_TOOL]
gcode:
    {% set tool = params.TOOL|int %}
    {% set sv = printer.save_variables.variables %}
    
    {% set inv_key = 'ace_inventory_0' if tool < 4 else 'ace_inventory_1' %}
    {% set inv_idx = tool if tool < 4 else tool - 4 %}
    {% set hw_sku = "none" %}
    {% set hw_status = "unknown" %}
    
    {% if inv_key in sv %}
        # Sanitize strings to prevent quote-mismatch and parser errors
        {% set hw_sku = sv[inv_key][inv_idx].sku|default("none")|string|trim|replace("'", "")|replace('"', "") %}
        {% set hw_status = sv[inv_key][inv_idx].status|default("unknown")|string %}
    {% endif %}

    {% set m_id = sv["manual_spool_id_" ~ tool]|default(0)|int %}
    {% set m_lock_sku = sv["manual_spool_lock_sku_" ~ tool]|default("none")|string|trim|replace("'", "")|replace('"', "") %}

    {% set rfid_id = 0 %}
    {% set sku_map = sv.sku_map|default({}) %}
    
    {% if hw_sku in sku_map %}
        {% set rfid_id = sku_map[hw_sku] %}
    {% elif hw_sku | int(0) > 0 %}
        {% set rfid_id = hw_sku | int %}
    {% endif %}

    {% if hw_status == "empty" %}
        CLEAR_ACTIVE_SPOOL
    {% elif m_id > 0 and hw_sku == m_lock_sku %}
        SET_ACTIVE_SPOOL ID={m_id}
        {action_respond_info("Spoolman: Manually locked (ID %d) for Slot %d" % (m_id, tool))}
    {% elif rfid_id > 0 %}
        {% if m_id > 0 and hw_sku != m_lock_sku %}
            SAVE_VARIABLE VARIABLE=manual_spool_id_{tool} VALUE=0
        {% endif %}
        SET_ACTIVE_SPOOL ID={rfid_id}
        {action_respond_info("Spoolman: RFID-ID %d loaded (Slot %d)" % (rfid_id, tool))}
    {% else %}
        CLEAR_ACTIVE_SPOOL
        {action_respond_info("Spoolman: No ID found for SKU '%s' (Slot %d)" % (hw_sku, tool))}
    {% endif %}

[gcode_macro MAP_SKU]
description: Permanently maps a SKU to a Spoolman ID
gcode:
    {% set sku = params.SKU|default("")|string|replace("'", "")|replace('"', "") %}
    {% set id = params.ID|default(0)|int %}
    
    {% if sku == "" or id == 0 %}
        {action_respond_info("Error: Please provide both SKU and ID.")}
    {% else %}
        {% set sv = printer.save_variables.variables %}
        {% set current_map = sv.sku_map|default({}) %}
        
        # Deep copy dictionary to bypass Jinja2 scope limitations and prevent memory mutations
        {% set new_map = {} %}
        {% for k, v in current_map.items() %}
            {% set _dummy = new_map.update({k: v}) %}
        {% endfor %}
        {% set _dummy = new_map.update({sku: id}) %}
        
        SAVE_VARIABLE VARIABLE=sku_map VALUE="{new_map}"
        {action_respond_info("Spoolman: SKU '%s' permanently mapped to ID %d." % (sku, id))}
    {% endif %}

[gcode_macro UNMAP_SKU]
description: Removes a mapped SKU from storage
gcode:
    {% set sku = params.SKU|default("")|string|replace("'", "")|replace('"', "") %}
    {% set sv = printer.save_variables.variables %}
    {% set current_map = sv.sku_map|default({}) %}
    
    {% if sku in current_map %}
        {% set new_map = {} %}
        {% for k, v in current_map.items() %}
            {% if k != sku %}
                {% set _dummy = new_map.update({k: v}) %}
            {% endif %}
        {% endfor %}
        SAVE_VARIABLE VARIABLE=sku_map VALUE="{new_map}"
        {action_respond_info("Spoolman: SKU '%s' successfully unmapped." % sku)}
    {% else %}
        {action_respond_info("Spoolman: SKU '%s' not found." % sku)}
    {% endif %}

[gcode_macro SPOOLMAN_MANUAL_SLOT]
description: Links a manual ID to the current spool in the specified slot
gcode:
    {% set slot = params.SLOT|default(-1)|int %}
    {% set id = params.ID|default(0)|int %}
    
    {% if slot >= 0 and slot <= 7 %}
        {% set sv = printer.save_variables.variables %}
        
        {% set inv_key = 'ace_inventory_0' if slot < 4 else 'ace_inventory_1' %}
        {% set inv_idx = slot if slot < 4 else slot - 4 %}
        {% set current_hw_sku = "none" %}
        
        {% if inv_key in sv %}
            {% set current_hw_sku = sv[inv_key][inv_idx].sku|default("none")|string|replace("'", "")|replace('"', "") %}
        {% endif %}

        SAVE_VARIABLE VARIABLE=manual_spool_id_{slot} VALUE={id}
        # Explicit escaping ensures correct parsing via ast.literal_eval on load
        SAVE_VARIABLE VARIABLE=manual_spool_lock_sku_{slot} VALUE="\"{current_hw_sku}\""
        
        {action_respond_info("Spoolman: Slot %d manually locked to ID %d (Base SKU: %s)" % (slot, id, current_hw_sku))}
    {% else %}
        {action_respond_info("Error: SLOT must be between 0 and 7.")}
    {% endif %}

#####################################################################
#   Toolchange Triggers
#####################################################################

[gcode_macro T0]
gcode: 
  {% set p_len = params.PURGELENGTH|default(0) %}
  _SET_SPOOL_BY_TOOL TOOL=0
  ACE_CHANGE_TOOL TOOL=0 PURGELENGTH={p_len}

