    G90
    G1 F6000
    G1 Y370
    G1 X125.5
    G1 Y352
    VEL_POP

[gcode_macro NOZZLE_WIPE_SEQUENCE]
gcode:
        WIPE_ENTER
        WIPE_NOZZLE
        WIPE_STOP
        WIPE_EXIT

[gcode_macro RESUME_NOZZLE_WIPE_SEQUENCE]
gcode:
    NOZZLE_WIPE_SEQUENCE

[gcode_macro TO_THROW_POSITION]
gcode:
    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300
    G90
    G1 X105 F12000
    G1 Y352 F12000
    G1 Y370 F6000
    G1 Y375 F3000
    G1 X87 F1000
    VEL_POP

[gcode_macro TO_BLADE]
# VERIFY on hardware: scaled from the KS1 values (11mm in front of the throw row)
gcode:
    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300
    G90
    G1 F12000
    G1 X87
    G1 Y364
    VEL_POP

[gcode_macro TO_FRONT_OF_THROW_BLADE]
