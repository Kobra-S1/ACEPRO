    WIPE_NOZZLE1
    WIPE_NOZZLE1
    VEL_POP

[gcode_macro WIPE_STOP]
gcode:
    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300
