# NOTE: unlike the KS1 the MAX extruder dir pin is NOT inverted
dir_pin : nozzle_mcu:PA11
enable_pin : !nozzle_mcu:PC13
microsteps : 16
full_steps_per_rotation:200
rotation_distance :5.0708945897
nozzle_diameter : 0.400
filament_diameter : 1.750
max_extrude_cross_section:50
heater_pin : nozzle_mcu:PB8
sensor_type : NTC ZM3486 HNS112HC4570G0060Y3486
sensor_pin : nozzle_mcu:PA0
control : pid
pid_Kp : 17.393
pid_Ki : 0.698
pid_Kd : 108.268
min_temp : -180
min_extrude_temp : 170
max_temp : 360
pressure_advance: 0.02

[heater_bed]
heater_pin : PB9
sensor_type : NTC 100K beta 3950
sensor_pin : PB0
control : pid
pid_Kp : 33.536
pid_Ki : 0.441
pid_Kd : 634.454
min_temp : -200
max_temp : 140  #NTC ADC error threshold
# Large AC-style bed on the MAX -> slow PWM cycle as in stock go-klipper
pwm_cycle_time:0.3



[tmc2209 stepper_x]
# The MAX uses a split UART (separate RX/TX) unlike the KS1 single-wire UART
uart_pin : PA3
tx_pin : PA2
uart_address : 3
run_current : 1.2
hold_current:0.75
sense_resistor: 0.0750
stealthchop_threshold :0
interpolate : True
driver_SGTHRS: 80
#diag_pin: PA6   # only with endstop_pin: tmc2209_stepper_x:virtual_endstop
driver_MULTISTEP_FILT: False

[tmc2209 stepper_y]
uart_pin : PA3
tx_pin : PA2
uart_address : 1
run_current : 1.2
hold_current:0.75
sense_resistor: 0.075
stealthchop_threshold :0
interpolate : True
driver_SGTHRS: 80
#diag_pin: PA15  # only with endstop_pin: tmc2209_stepper_y:virtual_endstop
driver_MULTISTEP_FILT: False

[tmc2209 stepper_z]
uart_pin : PA3
tx_pin : PA2
uart_address : 2
run_current : 1.0
hold_current:0.8
sense_resistor: 0.0750
stealthchop_threshold : 0
interpolate : True
driver_MULTISTEP_FILT: False

[tmc2209 extruder]
uart_pin : nozzle_mcu:PA3
uart_address : 3
run_current : 0.6
hold_current:0.3
sense_resistor: 0.075
# KS1 MAX runs the extruder in spreadCycle (KS1 uses stealthChop / 99999)
stealthchop_threshold : 0
interpolate : True
driver_SEMIN:15
driver_SEUP:3
driver_SEMAX:15
driver_SEDN:3
driver_SEIMIN:1
driver_MULTISTEP_FILT: False

