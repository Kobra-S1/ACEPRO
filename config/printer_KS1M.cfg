[gcode_macro UNDERLINE]
gcode:
    M83
    G90
    G92 E0
    G0 X5 Y4 F7200
    G1 Z0.30 F1200
    G1 X250 E10 F1200
    G1 Y5   E0.6 F1200
    G1 X5   E10 F1200
