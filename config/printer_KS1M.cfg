# This file contains common configurations and pin mappings for the Anycubic
# Kobra S1 MAX (KS1M) printer.
#
# INITIAL / BETA VERSION - derived from printer_KS1.cfg with the hardware and
# geometry values extracted from the stock go-klipper printer.cfg of the
# KS1 MAX (device_type: "Anycubic Kobra S1 Max", print_size 350*350*350mm).
# Everything marked "VERIFY" below could not be confirmed against real
# hardware yet - check those before the first unattended print.
#
# Requires (via include below): printer_generic_macros.cfg for PAUSE/RESUME
# scaffolding, insert/runout prompt helpers, VEL_PUSH/POP, load/unload/purge
# helpers; ace_KS1M.cfg for ACE-specific macros and optional
# _ACE_STATE/_ACE_HANDLE_PRINT_END.
# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
[include printer_generic_macros.cfg]

######### Must be placed above ace.cfg if you want to use them with ACE Pro driver #########

# KS1 MAX toolhead filament detection.
# Unlike the KS1 the MAX has NO static filament-presence switch in the toolhead
# (stock go-klipper leaves [filament_hub] switch_pin empty and uses a
# [filament_motion_sensor] with pin_a/pin_b instead). The two phase-shifted
# encoder channels are mapped onto filament_tracker here - same approach as
# the K3M config.
[filament_tracker filament_runout_nozzle]
# KS1 MAX motion sensor (quadrature-like pulses):
# - tracker_detect_pin and tracker_encoder_pin are the two phase-shifted channels
# - stock go-klipper: [filament_motion_sensor] pin_a: nozzle_mcu:PA5 / pin_b: nozzle_mcu:PA6
# VERIFY: pin polarity. If the tracker reports "no filament" with filament
# loaded, prefix both pins with '!' (the K3M needs the inverted variant).
tracker_detect_pin: nozzle_mcu:PA5
tracker_encoder_pin: nozzle_mcu:PA6
signal_type: gpio
# go-klipper mm_per_pulse: theoretical 5.978 (29.89mm wheel / 5 holes), measured 5.02
length_per_pulse: 5.02
absence_timeout: 2
pause_on_runout: False
runout_gcode:
    {% set ps = printer.print_stats.state|string %}
    {% if ps in ["printing", "paused"] %}
        TO_THROW_POSITION
        RESPOND TYPE=command MSG="action:prompt_begin Filament Runout"
        RESPOND TYPE=command MSG="action:prompt_text Filament runout detected. Print is paused. Insert filament into the toolhead, it will be pulled in automatically."
        RESPOND TYPE=command MSG="action:prompt_button Cancel Print|RUNOUT_CANCEL_PRINT"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        { action_respond_info("ANY[m]: Runout ignored (state=%s)" % ps) }
    {% endif %}
insert_gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    {% set ps = printer.print_stats.state|string %}
    {% if ps == "paused" %}
        M83
        G92 E0
        G1 E150 F300
        G92 E0
        FLUSH_POOP
        RESPOND TYPE=command MSG="action:prompt_begin Filament Loaded"
        RESPOND TYPE=command MSG="action:prompt_text Filament detected. Choose next action:"
        RESPOND TYPE=command MSG="action:prompt_button Extrude 50mm|INSERT_EXTRUDE_50"
        RESPOND TYPE=command MSG="action:prompt_button Resume Print|INSERT_RESUME_PRINT"
        RESPOND TYPE=command MSG="action:prompt_button Cancel Print|INSERT_CANCEL_PRINT"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif ps not in ["printing", "paused"] %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament Detected"
        RESPOND TYPE=command MSG="action:prompt_text Filament detected while printer is idle. Load filament to nozzle?"
        RESPOND TYPE=command MSG="action:prompt_button Load Filament (@245°C)|INSERT_LOAD_FILAMENT"
        RESPOND TYPE=command MSG="action:prompt_button Dismiss|INSERT_DISMISS"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        { action_respond_info("ANY[m]: Insert ignored (state=%s)" % ps) }
    {% endif %}

event_delay: 4.0
pause_delay: 1.5

