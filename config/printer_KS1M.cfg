#jump_speed_max : 120
#device_type: Anycubic Kobra S1 Max
#print_size: 350*350*350mm



[stepper_x]
step_pin : PC14
dir_pin : PC15
enable_pin : !PC13
microsteps : 16
full_steps_per_rotation:200
rotation_distance :39
position_endstop : -3
position_min : -3
position_max : 358
homing_speed : 30
homing_retract_dist:0
second_homing_speed:80
# KS1 MAX homes X off PA6. Unlike the KS1 (separate switch on PA8) this is the
# same pin the driver DIAG line sits on, i.e. the MAX homes sensorless.
# Alternative (true StallGuard endstop): comment the line below, use
#   endstop_pin: tmc2209_stepper_x:virtual_endstop
# and uncomment diag_pin in [tmc2209 stepper_x].
endstop_pin: PA6
#step_pulse_duration: 0.000002   # 2us

[stepper_y]
step_pin : PA0
dir_pin : PB12
enable_pin : !PC13
microsteps : 16
full_steps_per_rotation:200
rotation_distance :39
position_endstop : -2
position_min : -2
position_max : 380
homing_speed : 30
homing_retract_dist:0
second_homing_speed:80
# See the note in [stepper_x]; virtual_endstop alternative is
#   endstop_pin: tmc2209_stepper_y:virtual_endstop
endstop_pin: PA15
#step_pulse_duration: 0.000002   # 2us

[cs1237]
# Strain-gauge based nozzle probe. KS1 MAX moved all three lines compared to
# the KS1 (PA7/PA6/PA5 -> PA7 pulldown / PA15 / PB3) and uses a much lower
# trigger threshold.
level_pin:~nozzle_mcu:PA7
dout_pin:nozzle_mcu:PA15
sclk_pin:nozzle_mcu:PB3
register:60
sensitivity: -800
head_block_sensitivity:-300000
scratch_sensitivity:-100000
self_check_sensitivity:-400
block_filament_sensitivity:-3000


[probe_ks1]
pin : PB2
z_offset:0
x_offset:0
y_offset:0
speed : 3.0
final_speed : 4.0
lift_speed : 3.0
samples: 3
sample_retract_dist: 3
samples_result: median
# stock go-klipper uses 0.02 with 2 samples; 0.03 is a bit more forgiving with
# 3 samples/median on the large MAX bed
samples_tolerance: 0.03
samples_tolerance_retries:20


[bed_mesh]
