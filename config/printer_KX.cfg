    G92 E0
    G1 E-1 F300
    G1 Y4 F2400
    G1 X10 F9600
    G1 Z0.28
    G1 E1 F300
    G1 X180 E40 F500
    M400
    G92 E0
    G1 E-0.5 F300
    G1 Z2
    M400

[gcode_macro MOVE_END_POS]
