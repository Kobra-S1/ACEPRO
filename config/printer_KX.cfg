# This file contains common configurations and pin mappings for the Anycubic
# Kobra X (KX) printer.
#
# ALPHA - taken from the one Kobra X this has run on. Everything marked
# VERIFY below is that machine's value or a stock value never checked here.
#
# Needs the Kobra Klipper fork with its Kobra X modules, not mainline
# Klipper: [motor_link], [motor_steploss], [motor_anc], [probe_ks1], [cs1237]
# and the kx_* sections of kx_multimaterial.cfg live only there, and the MCUs
# must run the fork's KX firmware. The KX modules are not on a public branch
# of the fork yet (see the Kobra X section of README.md).
#
# Requires (via include below): printer_generic_macros.cfg for PAUSE/RESUME
# scaffolding, insert/runout prompt helpers, VEL_PUSH/POP, load/unload/purge
# helpers; kx_multimaterial.cfg (from the fork's config/ directory) for the
# four-inlet turret, the tool changer, CUT_TIP and the resume purge hooks;
# ace_KX.cfg for ACE-specific macros and optional _ACE_STATE/_ACE_HANDLE_PRINT_END.
#
# Tool changes belong to [kx_toolchanger]: it owns T0..Tn and calls
# ACE_CHANGE_TOOL only for the inlets kx_multimaterial.cfg marks 'ace'.
[include mainsail.cfg]
[include printer_generic_macros.cfg]

[exclude_object]
[gcode_macro _CLIENT_VARIABLE]

#variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
#variable_custom_park_x    : 0.0   ; custom x position; value must be within your defined min and max of X
#variable_custom_park_y    : 0.0   ; custom y position; value must be within your defined min and max of Y
#variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
#variable_retract          : 1.0   ; the value to retract while PAUSE
#variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
#variable_speed_retract    : 35.0  ; retract speed in mm/s
#variable_unretract        : 1.0   ; the value to unretract while RESUME
#variable_speed_unretract  : 35.0  ; unretract speed in mm/s
#variable_speed_hop        : 15.0  ; z move speed in mm/s
#variable_speed_move       : 100.0 ; move speed in mm/s
#variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
#variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
## !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
#variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
#variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
#variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
##                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
## !!! Custom macros, please use with care and review the section of the corresponding macro.
## These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
## Only  single line commands are supported, please create a macro if you need more than one command.
#variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
#variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
#variable_user_cancel_macro: ""    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
gcode:

[force_move]
enable_force_move: True

[include kx_multimaterial.cfg]

# Keeps the turret position and the loaded tool across restarts
# (kx_selector, kx_toolchanger). The same file ace_KX.cfg names.
[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

# ACE combo setup only (ACE slots merged onto one turret inlet): the RDM
# connector on the mainboard, filament presence (PA5) and movement (PA4).
# Uncomment together with filament_runout_sensor_name_rdm in ace_KX.cfg.
#[filament_tracker filament_runout_rdm]
#tracker_detect_pin: PA5
#tracker_encoder_pin: PA4
#signal_type: adc
#safe_unwind_len: 150
#length_per_pulse: 1.86532063806894   # VERIFY: Kobra S1 RDM value
#adc_inverted: True                    # VERIFY: polarity on the KX
#detect_pin_is_switch: True
#absence_timeout: 2
#pause_on_runout: False

[include ace_KX.cfg]

#######################
#For tunneled-klipper:#
#######################
[virtual_sdcard]
path: ~/printer_data/gcodes

[mcu]
serial : /dev/ttyGS0
restart_method : command
baud : 576000

[mcu nozzle_mcu]
serial : /dev/ttyGS1
restart_method : command
baud : 576000


[printer]
kinematics: cartesian
max_velocity: 450
max_accel: 10000
square_corner_velocity: 20.0
max_z_velocity: 12
max_z_accel: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100

[temperature_sensor mcu_nozzle_temp]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu
min_temp: 0
max_temp: 100

# X/Y/Z are driven by the motor MCU through [motor_link]; the step and dir
# pins in [stepper_x/y/z] are placeholders Klipper requires.
[motor_link]
axes: x, y, z
device_type: NF026
# Seconds between motor MCU fault polls; 0 turns the poll off.
status_interval: 1.0
#watchdog_timeout: 2.0
# Reset the motor MCU at every connect, so FIRMWARE_RESTART clears a latched
# axis fault.
#reset_on_connect: True

# Step loss on X/Y. mode: report only logs it; pause runs PAUSE; recover
# re-homes X/Y and resumes.
[motor_steploss]
enable: True
mode: report
#retract_length: 3
#extrude_length: 2
#z_hop: 0

# Mainsail's MCU list cannot show the motor MCU; this prints its state.
[gcode_macro MOTOR_MCU_STATUS]
description: Motor MCU firmware version, per-axis state and step queue fill
gcode:
    {% set link = printer.motor_link %}
    {action_respond_info("motor MCU firmware: %s" % (link.version or "unknown",))}
    {% if not link.axes %}
    {action_respond_info("motor MCU: no state read yet (status_interval 0?)")}
    {% endif %}
    {% for name, axis in link.axes.items() %}
    {% if axis.state %}
    {action_respond_info("axis %s: 0x%04x %s" % (name, axis.state, axis.faults|join(", ")))}
    {% else %}
    {action_respond_info("axis %s: ok" % (name,))}
    {% endif %}
    {% endfor %}
    QUERY_MOTOR_MOVE_COUNT

# Motor noise cancellation calibration: run ACTIVE_NOISE_REDUCTION_START with
# the bed clear (about 15 minutes). The motor MCU stores the result itself.
[motor_anc]
speed_range: 70, 270
move_range: 0, 260
amplitude: 40
move_count: 12
arc_move_count: 2
circle_center: 127, 127
radius: 100

[stepper_x]
# Run current while homing (read by [motor_link]).
homing_current: 1.0
step_pin: PG5
dir_pin: !PG4
enable_pin: !PC13
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 39
position_endstop: -18.5
position_min: -18.5
position_max: 280
homing_speed: 100
# Sensorless homing on the X driver's DIAG line ([tmc2209 stepper_x]).
homing_retract_dist: 15
second_homing_speed: 60
endstop_pin: tmc2209_stepper_x:virtual_endstop

[stepper_y]
# Run current while homing (read by [motor_link]).
homing_current: 1.4
step_pin: PC4
dir_pin: PA7
enable_pin: !PC13
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 39
position_endstop: -6.5
position_min: -6.5
position_max: 272.5
homing_speed: 60
# Sensorless homing on the Y driver's DIAG line ([tmc2209 stepper_y]).
homing_retract_dist: 15
second_homing_speed: 60
endstop_pin: tmc2209_stepper_y:virtual_endstop

[stepper_z]
step_pin: PC9
dir_pin: PB1
enable_pin: !PC13
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_min: -1   # the probe descends to position_min, so this caps a failed probe at 1 mm into the bed
position_max: 262
homing_speed: 12
homing_retract_dist: 2
second_homing_speed: 6

[extruder]
# ACE loading needs a long extrude-only move
max_extrude_only_distance: 1200.0
max_extrude_only_accel: 6500
max_extrude_only_velocity: 250
step_pin: nozzle_mcu:PA12
dir_pin: nozzle_mcu:PA11
enable_pin: !nozzle_mcu:PC15
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.499
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 50
heater_pin: nozzle_mcu:PC2
sensor_type: NTC ZM3863 HNS112HC4570G0 avata
sensor_pin: nozzle_mcu:PC3
control: pid
pid_Kp: 12.206120
pid_Ki: 0.917208
pid_Kd: 72.016108
min_temp: 0
min_extrude_temp: 170
max_temp: 320
pressure_advance: 0.03


[heater_bed]
heater_pin: PA0
sensor_type: NTC 100K beta 3950
sensor_pin: PB0
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 248.182
min_temp: 0
max_temp: 120

[tmc2209 stepper_x]
uart_pin: PA3
tx_pin: PA2
uart_address: 3
hardware_usart: True
run_current: 1.0
hold_current: 0.8
sense_resistor: 0.08
stealthchop_threshold: 0
interpolate: True
driver_SGTHRS: 255
diag_pin: PA6

[tmc2209 stepper_y]
uart_pin: PA3
tx_pin: PA2
uart_address: 1
hardware_usart: True
run_current: 1.6
hold_current: 0.9
sense_resistor: 0.08
stealthchop_threshold: 0
interpolate: True
driver_SGTHRS: 246
diag_pin: PA15

[tmc2209 stepper_z]
uart_pin: PA3
tx_pin: PA2
uart_address: 2
hardware_usart: True
run_current: 0.7
hold_current: 0.6
sense_resistor: 0.08
stealthchop_threshold: 99999
interpolate: True
driver_MULTISTEP_FILT: False

[tmc2209 extruder]
uart_pin: nozzle_mcu:PC11
tx_pin: nozzle_mcu:PC10
uart_address: 0
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.1
interpolate: True

# Filament selector of the built-in multicolour hub
[manual_stepper select_stepper]
step_pin: nozzle_mcu:PB9
dir_pin: !nozzle_mcu:PB8
enable_pin: !nozzle_mcu:PC15
full_steps_per_rotation: 200
microsteps: 16
rotation_distance: 3.14
velocity: 30
accel: 5
endstop_pin: nozzle_mcu:PA2

[tmc2209 manual_stepper select_stepper]
uart_pin: nozzle_mcu:PD2
tx_pin: nozzle_mcu:PC12
uart_address: 0
run_current: 0.4
hold_current: 0.01
sense_resistor: 0.5
stealthchop_threshold: 99999
interpolate: True

[probe_ks1]
pin: PB2
x_offset: 0
y_offset: 0
z_offset: 0
speed: 4.0
lift_speed: 4.0
samples: 2
sample_retract_dist: 0.5
samples_tolerance: 0.02
samples_tolerance_retries: 5

[bed_mesh]
speed: 250
horizontal_move_z: 1
mesh_min: 20,20
mesh_max: 230,230
probe_count: 7,7
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.2
split_delta_z: 0.0125
zero_reference_position: 130,130
fade_start: 1
fade_end: 50
adaptive_margin: 0

[axis_twist_compensation]
speed: 50
horizontal_move_z: 5
calibrate_start_x: 10
calibrate_end_x: 240
calibrate_y: 127

[safe_z_home]
home_xy_position: 120,120
speed: 200
z_hop: 8
z_hop_speed: 8.0

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 20
heating_gain: 1

[verify_heater heater_bed]
max_error: 120
check_gain_time: 300
hysteresis: 5
heating_gain: 1

[controller_fan controller_fan]
pin: PB6
fan_speed: 1

[heater_fan extruder_fan]
pin: nozzle_mcu:PC1

[fan]
pin: nozzle_mcu:PA0
cycle_time: 0.002
hardware_pwm: true


# 7-segment display on the toolhead.
# Segment map:
#   seg7_h  GREEN PB2 = G (middle)  BLUE PB1 = F (top left)  WHITE PA6 = E (bottom left)
#   seg7_l  WHITE PB0 = A (top)     BLUE PC5 = B (top right)
#           GREEN PC4 = C (bottom right)                     RED  PA7 = D (bottom)
[led seg7_h]
green_pin: nozzle_mcu:PB2
blue_pin: nozzle_mcu:PB1
white_pin: nozzle_mcu:PA6

[led seg7_l]
red_pin: nozzle_mcu:PA7
green_pin: nozzle_mcu:PC4
blue_pin: nozzle_mcu:PC5
white_pin: nozzle_mcu:PB0

[gcode_macro SET_SEGMENTS]
description: Light exactly the named 7-segment segments: SET_SEGMENTS S=ABG [BRIGHTNESS=0..1]
gcode:
    {% set s = params.S|default("")|upper %}
    {% set b = params.BRIGHTNESS|default(1.0)|float %}
    {% if b < 0.0 or b > 1.0 %}
        { action_raise_error("SET_SEGMENTS: BRIGHTNESS must be 0.0..1.0, got %s" % params.BRIGHTNESS) }
    {% endif %}
    SET_LED LED=seg7_h GREEN={b if "G" in s else 0} BLUE={b if "F" in s else 0} WHITE={b if "E" in s else 0}
    SET_LED LED=seg7_l WHITE={b if "A" in s else 0} BLUE={b if "B" in s else 0} GREEN={b if "C" in s else 0} RED={b if "D" in s else 0}

[gcode_macro _SEG7_FONT]
description: Glyph table for the toolhead display (internal - use SET_CHAR or SHOW_TEXT)
# K, M, V, W and X have no 7-segment form.
variable_font: {
        "0":"ABCDEF", "1":"BC",     "2":"ABDEG",  "3":"ABCDG",   "4":"BCFG",
        "5":"ACDFG",  "6":"ACDEFG", "7":"ABC",    "8":"ABCDEFG", "9":"ABCDFG",
        "A":"ABCEFG", "b":"CDEFG",  "C":"ADEF",   "c":"DEG",     "d":"BCDEG",
        "E":"ADEFG",  "F":"AEFG",   "G":"ACDEF",  "H":"BCEFG",   "h":"CEFG",
        "I":"EF",     "i":"C",      "J":"BCD",    "L":"DEF",     "n":"CEG",
        "O":"ABCDEF", "o":"CDEG",   "P":"ABEFG",  "q":"ABCFG",   "r":"EG",
        "S":"ACDFG",  "t":"DEFG",   "U":"BCDEF",  "u":"CDE",     "y":"BCDFG",
        "Z":"ABDEG",  "-":"G",      "_":"D",      "=":"DG",      " ":""
    }
gcode:

[gcode_macro SET_CHAR]
description: Show one character: SET_CHAR C=A [BRIGHTNESS=0..1] (C= blanks; K M V W X cannot be drawn)
gcode:
    {% set c = params.C|default("") %}
    {% set font = printer["gcode_macro _SEG7_FONT"].font %}
    {% if c|length > 1 %}
        { action_raise_error("SET_CHAR: C must be a single character, got '%s'" % c) }
    {% endif %}
    {% set glyph = font.get(c, font.get(c.swapcase())) if c else "" %}
    {% if glyph is none %}
        { action_raise_error("SET_CHAR: '%s' has no 7-segment form (K M V W X cannot be drawn)" % c) }
    {% endif %}
    SET_SEGMENTS S={glyph} BRIGHTNESS={params.BRIGHTNESS|default(1.0)|float}

[gcode_macro SET_DIGIT]
description: Show a digit on the toolhead display: SET_DIGIT N=0..9 [BRIGHTNESS=0..1] (N=-1 blanks)
gcode:
    {% set n = params.N|default(-1)|int %}
    {% set b = params.BRIGHTNESS|default(1.0)|float %}
    {% if n == -1 %}
        SET_SEGMENTS S= BRIGHTNESS={b}
    {% elif n < 0 or n > 9 %}
        { action_raise_error("SET_DIGIT: N must be 0..9 or -1 to blank, got %d" % n) }
    {% else %}
        SET_CHAR C={n} BRIGHTNESS={b}
    {% endif %}

[gcode_macro SHOW_TEXT]
description: Spell a string out one character at a time: SHOW_TEXT TEXT=HELLO [DELAY=0.4] [BRIGHTNESS=0..1] [REPEAT=1]
# DELAY is seconds per character. The text scrolls on a timer, so it keeps
# running during a print.
variable_text: ""
variable_pos: 0
variable_delay: 0.4
variable_brightness: 1.0
variable_repeat: 0
gcode:
    {% set t = params.TEXT|default("") %}
    {% set d = params.DELAY|default(0.4)|float %}
    {% set b = params.BRIGHTNESS|default(1.0)|float %}
    {% set rep = params.REPEAT|default(0)|int %}
    {% set font = printer["gcode_macro _SEG7_FONT"].font %}
    {% if d <= 0.0 %}
        { action_raise_error("SHOW_TEXT: DELAY is seconds per character and must be > 0, got %s" % d) }
    {% endif %}
    {% if b < 0.0 or b > 1.0 %}
        { action_raise_error("SHOW_TEXT: BRIGHTNESS must be 0.0..1.0, got %s" % b) }
    {% endif %}
    {% set ns = namespace(bad="") %}
    {% for c in t %}
        {% if c not in font and c.swapcase() not in font %}
            {% set ns.bad = ns.bad ~ c %}
        {% endif %}
    {% endfor %}
    {% if ns.bad %}
        { action_raise_error("SHOW_TEXT: cannot display '%s' from TEXT='%s' (K M V W X have no 7-segment form)" % (ns.bad, t)) }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=SHOW_TEXT VARIABLE=text VALUE="'{t}'"
    SET_GCODE_VARIABLE MACRO=SHOW_TEXT VARIABLE=pos VALUE=0
    SET_GCODE_VARIABLE MACRO=SHOW_TEXT VARIABLE=delay VALUE={d}
    SET_GCODE_VARIABLE MACRO=SHOW_TEXT VARIABLE=brightness VALUE={b}
    SET_GCODE_VARIABLE MACRO=SHOW_TEXT VARIABLE=repeat VALUE={rep}
    UPDATE_DELAYED_GCODE ID=_seg7_tick DURATION=0.01

[gcode_macro STOP_TEXT]
description: Stop a running SHOW_TEXT and blank the display
gcode:
    UPDATE_DELAYED_GCODE ID=_seg7_tick DURATION=0
    SET_GCODE_VARIABLE MACRO=SHOW_TEXT VARIABLE=repeat VALUE=0
    SET_SEGMENTS S=

[delayed_gcode _seg7_tick]
gcode:
    {% set st = printer["gcode_macro SHOW_TEXT"] %}
    {% if st.pos < st.text|length %}
        SET_CHAR C="{st.text[st.pos]}" BRIGHTNESS={st.brightness}
        SET_GCODE_VARIABLE MACRO=SHOW_TEXT VARIABLE=pos VALUE={st.pos + 1}
        UPDATE_DELAYED_GCODE ID=_seg7_tick DURATION={st.delay}
    {% elif st.repeat %}
        SET_SEGMENTS S= BRIGHTNESS={st.brightness}
        SET_GCODE_VARIABLE MACRO=SHOW_TEXT VARIABLE=pos VALUE=0
        UPDATE_DELAYED_GCODE ID=_seg7_tick DURATION={st.delay}
    {% else %}
        SET_SEGMENTS S= BRIGHTNESS={st.brightness}
    {% endif %}

[pid_calibrate]

[lis2dw]
spi_speed: 1000000
cs_pin: nozzle_mcu:PB12
spi_bus: spi2
axes_map: y,z,x

[lis2dw bed]
spi_speed: 1000000
cs_pin: PB12
spi_bus: spi2
