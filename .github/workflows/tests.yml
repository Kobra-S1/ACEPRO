name: Tests

on:
  pull_request:
  push:
    branches: [dev]

# Cancel superseded runs when a PR is updated with new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-all-tests:
    name: run_all_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full test suite (syntax, flake8, pytest)
        run: bash tests/run_all_tests.sh
